name: Deploy regional VPN

on:
  workflow_dispatch:
    inputs:
      region:
        description: Azure region
        required: true
        default: denmarkeast
        type: choice
        options:
          - denmarkeast
          - westeurope
          - northeurope
          - swedencentral
          - germanywestcentral
          - francecentral
          - uksouth
          - switzerlandnorth
          - polandcentral
          - eastus
          - eastus2
          - centralus
          - southcentralus
          - westus2
          - westus3
          - canadacentral
          - brazilsouth
          - australiaeast
          - southeastasia
          - eastasia
          - japaneast
          - koreacentral
          - centralindia
          - southafricanorth
          - uaenorth

permissions:
  contents: read

concurrency:
  group: vpn-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: azure
    env:
      AZURE_CORE_OUTPUT: none
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sign in with workload identity federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and wait for VPN bootstrap
        shell: bash
        env:
          AZURE_LOCATION: ${{ inputs.region }}
          VPN_ADMIN_OBJECT_ID: ${{ secrets.VPN_ADMIN_OBJECT_ID }}
          VPN_VM_SIZE: ${{ secrets.VPN_VM_SIZE }}
        run: bash scripts/deploy.sh
